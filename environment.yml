# Conda environment for MoPlan (Linux x86_64, NVIDIA GPU, CUDA 12.4 runtime).
#
# NOT TESTED: no environment built from this file has been run. The tested,
# recommended route is the lock file of the reference environment:
#
#   conda create --name moplan --file setup/conda-linux-64.lock.txt
#   conda activate moplan
#   pip install -r requirements.txt
#   bash setup/install_third_party.sh
#
# This file pins only the packages below. The solver picks other low-level
# libraries than the reference environment (mkl, the OpenMP runtime,
# libjpeg-turbo, ffmpeg); the reference mkl / intel-openmp builds come from the
# Anaconda main channel and cannot be pinned with these channels. Torch builds
# of the pytorch channel are known to fail at import with mkl 2024.1 or newer;
# if a solve picks such a version, add "mkl<2024.1". See docs/INSTALL.md,
# option B.
#
#   conda env create -f environment.yml
#   conda activate moplan
#   bash setup/install_third_party.sh
#
# The pip list must match requirements.txt minus the packages conda provides
# (torch, torchvision, numpy); tests/test_setup.py checks this.
name: moplan
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.11.9
  - pytorch=2.5.1=py3.11_cuda12.4_cudnn9.1.0_0
  - pytorch-cuda=12.4
  - torchvision=0.20.1=py311_cu124
  - numpy=2.4.6
  # numpy in the reference environment linked the netlib BLAS/LAPACK builds
  - libblas=3.9.0=1_h86c2bf4_netlib
  - libcblas=3.9.0=14_h8e06fc2_netlib
  - liblapack=3.9.0=14_h8876d29_netlib
  - pip
  - setuptools
  - git
  - pip:
      # core
      - scipy==1.17.1
      - opencv-python==4.13.0.92
      - pillow==12.2.0
      - PyYAML==6.0.3
      - tqdm==4.68.2
      - psutil==7.2.2
      - einops==0.8.2
      - h5py==3.16.0
      # Hugging Face stack
      - diffusers==0.38.0
      - transformers==5.11.0
      - tokenizers==0.22.2
      - sentencepiece==0.2.2
      - protobuf==7.36.2
      - ftfy==6.3.1
      - regex==2026.5.9
      - safetensors==0.8.0
      - huggingface_hub==1.19.0
      - hf-xet==1.5.1
      - accelerate==1.14.0
      - peft==0.19.1
      # video I/O
      - av==17.1.0
      - imageio==2.37.3
      - imageio-ffmpeg==0.6.0
      # runtime dependencies of SAM 2 (SAM 2 itself: setup/install_third_party.sh)
      - hydra-core==1.3.7
      - omegaconf==2.3.1
      - antlr4-python3-runtime==4.9.3
      - iopath==0.1.10
      - portalocker==3.2.0
      # tests
      - pytest==9.1.1
      - pluggy==1.6.0
      - iniconfig==2.3.1
      # transitive dependencies, pinned to the reference environment
      - annotated-doc==0.0.4
      - anyio==4.13.0
      - certifi==2026.7.22
      - charset-normalizer==3.4.7
      - click==8.4.1
      - filelock==3.29.3
      - fsspec==2026.4.0
      - h11==0.16.0
      - httpcore==1.0.9
      - httpx==0.28.1
      - idna==3.17
      - importlib_metadata==9.0.0
      - Jinja2==3.1.6
      - markdown-it-py==4.2.0
